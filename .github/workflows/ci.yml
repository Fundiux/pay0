name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Verify technology contract before installation
        run: |
          npm run test:technology
          npm run qa:technology
      - name: Install dependencies for public build fixture
        run: npm ci
      - name: Verify installed frontend matches lockfile
        run: npm ls --depth=0
      - name: Verify authorization policy
        run: node scripts/verify-authorization-policy.mjs
      - name: Verify canonical capability registrations
        run: |
          node scripts/verify-capability-registration.mjs
          node --test qa/scripts/capability-registration.test.mjs
      - name: Configure public build-only environment
        run: node qa/scripts/ci-frontend-build-env.mjs --write-github-env
      - name: Verify cumulative release baseline
        run: npm run qa:release-baseline
      - name: Validate committed source candidate
        run: node scripts/prepare-release-candidate.mjs --main-ref origin/main
      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-candidate-${{ github.sha }}
          path: output/release-candidates/
          if-no-files-found: ignore
          retention-days: 14
