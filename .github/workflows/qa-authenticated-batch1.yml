name: QA authenticated Batch 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-batch1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Materialize immutable functional candidate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/pay0-candidate 21e45105ccfeeb90c3f90f443884c4499547ebbf
          mkdir -p /tmp/pay0-candidate/qa
          cp -a qa/authenticated-isolation qa/authenticated-functions-entry qa/emulator-isolation /tmp/pay0-candidate/qa/
          cp firebase.authenticated-qa.json /tmp/pay0-candidate/
          test -f /tmp/pay0-candidate/qa/authenticated-functions-entry/index.js
          cd /tmp/pay0-candidate
          node qa/authenticated-isolation/verify-integrity.mjs
      - name: Build isolated authenticated QA image
        run: docker build --pull --tag pay0-qa-authenticated-batch1:local -f /tmp/pay0-candidate/qa/authenticated-isolation/Dockerfile /tmp/pay0-candidate
      - name: Run authenticated Batch 1 in isolation
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME=/tmp docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=768m \
            --tmpfs /opt/pay0/.next:rw,noexec,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=0755 \
            --tmpfs /opt/pay0/test-results:rw,noexec,nosuid,nodev,size=128m,uid=65532,gid=65532,mode=0755 \
            --tmpfs /opt/pay0/qa/playwright/test-results:rw,noexec,nosuid,nodev,size=128m,uid=65532,gid=65532,mode=0755 \
            --tmpfs /opt/pay0/qa/.auth:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --user 65532:65532 \
            --env HOME=/tmp --env PATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            pay0-qa-authenticated-batch1:local